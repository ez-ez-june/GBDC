<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#145c4a">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="일정">
  <title>굿바이대치</title>
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
  <div id="gate">
    <form id="gate-form" class="sheet">
      <p class="eyebrow">GBDC</p>
      <h1 id="gate-title">굿바이대치</h1>
      <p id="gate-help" class="help"></p>
      <label>비밀번호
        <input id="gate-password" type="password" autocomplete="current-password" required minlength="4" enterkeyhint="go">
      </label>
      <button class="primary" type="submit" id="gate-submit">들어가기</button>
      <p id="gate-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="wrap bar">
        <div>
          <p class="eyebrow" id="range"></p>
          <h1>굿바이대치</h1>
        </div>
        <p id="sync" class="sync" data-state="wait"><span class="dot"></span><span id="sync-text">확인 중</span></p>
      </div>
      <div class="wrap tools">
        <div class="tabs" role="tablist">
          <button type="button" id="tab-plan" role="tab" aria-selected="true">일정</button>
          <button type="button" id="tab-info" role="tab" aria-selected="false">항공·숙소</button>
        </div>
        <button type="button" id="logout" class="text">잠그기</button>
      </div>
      <div class="wrap days" id="days"></div>
    </header>
    <main class="wrap" id="main"></main>
    <div class="bottombar" id="bottom">
      <button type="button" id="add-item" class="primary">일정 추가</button>
      <button type="button" id="add-day" class="ghost">날짜 추가</button>
    </div>
    <section id="editor" class="editor" hidden role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <form id="editor-form"></form>
    </section>
  </div>
  <script src="/app.js?v=2" type="module"></script>
</body>
</html>
