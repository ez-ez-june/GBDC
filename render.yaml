services:
  - type: web
    name: gbdc
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/status
    envVars:
      - key: DATA_REPO
        value: git@github.com:ez-ez-june/GBDC-data.git
      - key: DATA_SSH_KEY_B64
        sync: false
      - key: PUBLIC_URL
        sync: false
